# =====================================================================
#  外卖系统 Nginx 网关配置
#    :80  顾客端 H5（静态 + /api 反代 + /files 图片反代）
#    :81  商家/管理端 Admin（静态 + /api 反代 + /files 图片反代）
#
#  端口隔离而非 /admin 子路径：admin 工程内部路由自带 /admin 段，
#  若挂在 /admin/ 子路径下会撞出 /admin/admin/xxx 的丑 URL。
# =====================================================================

# ---------------------------------------------------------------------
# 后端负载均衡池：两个实例，轮询分流
#
# max_fails=2 fail_timeout=10s 是"高可用"的关键：
#   连续 2 次连接失败 → 标记该节点 down → 10s 内不再转发给它；
#   10s 后试探恢复，成功则重新放回池子（自动剔除 + 自动恢复）。
#
# 换调度策略：把下面的 server 行前面加对应指令即可（同一时刻只能用一种）
#   1) 轮询（默认，不加指令）           —— 两实例均分
#   2) ip_hash;                        —— 同一客户端固定落到同一实例（会话粘滞）
#   3) least_conn;                     —— 新请求给当前连接数最少的实例
#   4) server backend-1:8080 weight=7; —— 权重分流（示例为 7:3）
# ---------------------------------------------------------------------
upstream takeout_backend {
    server backend-1:8080 max_fails=2 fail_timeout=10s;
    server backend-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# 客户端的真实 IP / 协议头，后端日志与限流要用
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# =====================================================================
#  顾客端 H5 —— 80
# =====================================================================
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    root  /usr/share/nginx/h5;
    index index.html;

    # 冒烟测试与监控探活用，不落业务日志
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # 后端接口：context-path 自带 /api，此处不做 rewrite
    location /api/ {
        proxy_pass http://takeout_backend;
        # 与 upstream 的 keepalive 配套：HTTP/1.1 + 清空 Connection 才能复用后端长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # 图片/头像：反代到 MinIO 的 takeout 桶（/files/a.jpg → minio:9000/takeout/a.jpg）
    location /files/ {
        proxy_pass http://minio:9000/takeout/;
        proxy_set_header Host $host;
        expires 7d;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =====================================================================
#  商家 / 管理端 Admin —— 81
# =====================================================================
server {
    listen 81;
    server_name _;
    client_max_body_size 10m;
    root  /usr/share/nginx/admin;
    index index.html;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://takeout_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location /files/ {
        proxy_pass http://minio:9000/takeout/;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}