# =====================================================================
#  外卖系统 Nginx 网关配置
#    :80  顾客端 H5（静态 + /api 反代 + /files 图片反代）
#    :81  商家/管理端 Admin（静态 + /api 反代 + /files 图片反代）
# =====================================================================

upstream takeout_backend {
    server backend-1:8080 max_fails=2 fail_timeout=10s;
    server backend-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# ---------------------------------------------------------------------
# 公共 header（给 /files/ 这类没重写 header 的 location 兜底）
# 注意：location 里只要出现任意 proxy_set_header，
#       父级这 4 行就会被整体覆盖丢失，所以 /api/ 里必须重写一遍。
# ---------------------------------------------------------------------
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# =====================================================================
#  顾客端 H5 —— 80
# =====================================================================
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;
    root  /usr/share/nginx/h5;
    index index.html;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://takeout_backend;

        # ★ 关键：这 4 行必须重复写，否则被下面的 Connection "" 覆盖
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接复用
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location /files/ {
        proxy_pass http://minio:9000/takeout/;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =====================================================================
#  商家 / 管理端 Admin —— 81
# =====================================================================
server {
    listen 81;
    server_name _;
    client_max_body_size 10m;
    root  /usr/share/nginx/admin;
    index index.html;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://takeout_backend;

        # ★ 关键：这 4 行必须重复写
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location /files/ {
        proxy_pass http://minio:9000/takeout/;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}