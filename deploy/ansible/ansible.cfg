# Ansible 主配置文件
# 查找顺序：ANSIBLE_CONFIG 环境变量 -> 当前目录 ansible.cfg -> ~/.ansible.cfg -> /etc/ansible/ansible.cfg

[defaults]
# 默认 inventory：不写 -i 时自动加载同目录的 inventory.ini
inventory           = inventory.ini

# 关闭 SSH 主机密钥检查：首次连接不再交互确认指纹。
# 学习环境图省事；生产建议用 ssh-keyscan 把目标机指纹写入 known_hosts。
host_key_checking   = False

# 失败不再生成 .retry 文件，保持目录干净
retry_files_enabled = False

# 输出用 yaml 格式，任务结果更易读
stdout_callback     = default
result_format       = yaml

# 自动探测目标机 Python 但不打印告警
interpreter_python  = auto_silent

[privilege_escalation]
# inventory 里 ansible_user=root，本身已是最高权限，无需再提权
become = False